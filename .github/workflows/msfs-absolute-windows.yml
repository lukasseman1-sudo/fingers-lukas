name: Fingers MSFS Absolute Windows test build
on:
  workflow_dispatch:
  pull_request:
    branches: [msfs-direct-input]
    paths:
      - '**/*.cs'
      - '**/*.csproj'
      - 'START_MSFS_ABSOLUTE.cmd'
      - '.github/workflows/msfs-absolute-windows.yml'
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Restore NuGet packages
        run: msbuild FingersApp.sln /t:Restore /p:Configuration=Release
      - name: Compile Windows x64
        run: msbuild FingersApp.sln /t:Build /p:Configuration=Release /p:Platform="Any CPU" /v:minimal
      - name: Package test application
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force package | Out-Null
          Copy-Item bin/Release/net48/* package/ -Recurse -Force
          Copy-Item START_MSFS_ABSOLUTE.cmd,MSFS_ABSOLUTE_TEST.md package/
          if (-not (Test-Path package/FingersApp.exe)) { throw "FingersApp.exe not found" }
      - uses: actions/upload-artifact@v4
        with:
          name: Fingers-MSFS-Absolute-Windows-experimental
          path: package/
