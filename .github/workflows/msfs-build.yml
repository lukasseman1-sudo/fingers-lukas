name: Build Fingers MSFS
on:
  workflow_dispatch:
  push:
    branches: [msfs-direct-input]
jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2
      - name: Restore packages
        run: msbuild FingersApp.sln /t:Restore /p:Configuration=Release
      - name: Build Windows executable
        run: msbuild FingersApp.sln /p:Configuration=Release /p:Platform="Any CPU"
      - name: Include MSFS starter
        shell: pwsh
        run: |
          '@echo off' | Out-File -Encoding ascii -FilePath "bin/Release/START_MSFS.cmd"
          'set FINGERS_MSFS=1' | Out-File -Append -Encoding ascii -FilePath "bin/Release/START_MSFS.cmd"
          'start "" "%~dp0FingersApp.exe"' | Out-File -Append -Encoding ascii -FilePath "bin/Release/START_MSFS.cmd"
      - uses: actions/upload-artifact@v4
        with:
          name: Fingers-MSFS-Windows-experimental
          path: bin/Release/
          if-no-files-found: error
